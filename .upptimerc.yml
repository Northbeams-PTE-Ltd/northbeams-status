# Northbeams Monitor — uptime config (Upptime)
owner: vibejoe
repo: northbeams-status

# Uptime check interval: every 30 min (Upptime default is every 5 min).
# Kept at 30 min to stay within the free GitHub Actions tier; lower this value
# for faster outage detection at higher Actions cost.
workflowSchedule:
  uptime: "*/30 * * * *"

sites:
  - name: Marketing site
    url: https://northbeams.com
  - name: Dashboard
    url: https://monitor.northbeams.com
  - name: Extension API
    url: https://monitor.northbeams.com/api/extension/event
    expectedStatusCodes:
      - 401
      - 405

status-website:
  cname: status.northbeams.com
  name: Northbeams Monitor
  links:
    - rel: stylesheet
      href: https://cdn.jsdelivr.net/gh/vibejoe/northbeams-status@660845e/themes/northbeams.css
  introTitle: "**Northbeams Monitor** — uptime and operational status."
  introMessage: Real-time uptime for the marketing site, dashboard, and extension ingestion API. Powered by [Upptime](https://upptime.js.org).
  navbar:
    - title: Status
      href: /
    - title: Website
      href: https://northbeams.com
